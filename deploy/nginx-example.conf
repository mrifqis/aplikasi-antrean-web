server {
    listen 80;
    listen [::]:80;
    server_name queue.example.com;

    root /var/www/queue-app;
    index index.php;

    access_log /var/log/nginx/queue-app.access.log;
    error_log  /var/log/nginx/queue-app.error.log;

    # Lindungi konfigurasi, skema, dan dokumentasi proyek.
    location ~* ^/(config(?:\.example)?\.php|schema\.sql|README\.md|LICENSE|NOTICE\.md|SECURITY\.md|\.htaccess)$ {
        deny all;
    }

    # Tolak hidden files, tetapi izinkan ACME challenge untuk sertifikat TLS.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Exact match ini mencegah root direktori berakhir sebagai 403 pada konfigurasi tertentu.
    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Setelah instalasi selesai, hapus install.php atau aktifkan blok berikut.
    # location = /install.php { deny all; }
}

